[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ato-skill-ado-cli"
version = "0.2.2"
description = "Azure DevOps Cloud CLI skill"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
  "jsonschema>=4.22.0",
]

[project.scripts]
ato-skill-ado-cli = "ato_skill_ado_cli.main:run"

[tool.setuptools]
package-dir = {"" = "cli"}

[tool.setuptools.packages.find]
where = ["cli"]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]
